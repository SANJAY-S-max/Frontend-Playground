<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickCounter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="box">
            <h1 class="title">Counter</h1>
            <p class="count" id="count">0</p>
            <div class="buttons">
                <button class="but" id="decrease">DECREASE</button>
                <button class="but" id="reset">RESET</button>
                <button class="but" id="increase">INCREASE</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
